[build-system]
requires = [ "setuptools>=80.9.0", "wheel",]
build-backend = "setuptools.build_meta"

[project]
name = "rom-manager"
version = "3.0.0"
description = "ROM Converter/Organizer (CHD/RVZ) + MCP Server + A2A Agent"
readme = "README.md"
classifiers = [ "Development Status :: 5 - Production/Stable", "License :: Public Domain", "Environment :: Console", "Operating System :: POSIX :: Linux", "Programming Language :: Python :: 3",]
requires-python = ">=3.12, <3.15"
dependencies = [ "agent-utilities>=2.0.0,<3.0.0", "python-dotenv>=1.2.2", "tqdm>=4.69.0", "requests>=2.34.2",]
[[project.authors]]
name = "Project Maintainers"
email = "maintainers@users.noreply.github.com"

[project.license]
text = "MIT"

[project.optional-dependencies]
mcp = [ "agent-utilities[mcp]>=2.0.0,<3.0.0",]
agent = [ "agent-utilities[agent-runtime,logfire]>=2.0.0,<3.0.0", "logfire>=4.38.0",]
native = [ "patool>=4.0.5",]
convert = [ "patool>=4.0.5",]
otel = [
    # CONCEPT:PHASE2-RECONCILE — capped under 1.44 (the modernize-bump floor
    # collided with the fleet's opentelemetry-instrumentation-* pins). The
    # exporter must stay on the same major.minor as the SDK, and logfire==4.38.0
    # (the only release available) caps opentelemetry-exporter-otlp-proto-http
    # below 1.44.0 as well.
    "opentelemetry-sdk<1.44",
    "opentelemetry-exporter-otlp<1.44",
]
all = [ "rom-manager[mcp,agent,native,otel]>=2.0.0",]
test = [
    "pytest-xdist>=3.8.0", "pytest>=9.1.1", "pytest-asyncio>=1.4.0", "pytest-cov>=7.1.0",]

[project.scripts]
rom-manager = "rom_manager.rom_manager:rom_manager"
rom-manager-mcp = "rom_manager.mcp_server:mcp_server"
rom-manager-agent = "rom_manager.agent_server:agent_server"

[project.entry-points."agent_utilities.skill_providers"]
rom-manager = "rom_manager.skills"

[project.entry-points."agent_utilities.ontology_providers"]
rom-manager = "rom_manager.ontology"

[project.entry-points."agent_utilities.source_connector_providers"]
rom-manager = "rom_manager.connectors"

[project.entry-points."agent_utilities.prompt_providers"]
rom-manager = "rom_manager.prompts"

[tool.setuptools]
include-package-data = true

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
check_untyped_defs = true

[dependency-groups]
dev = [
    "pytest-timeout>=2.4.0",
]

[tool.setuptools.package-data]
rom_manager = [ "mcp_config.json", "prompts/*.md", "romm/openapi.json", "prompts/**", "skills/**", "ontology/**", "connectors/**",]

[tool.ruff.lint]
select = [ "E", "F", "I", "UP", "B",]
ignore = [ "E402", "E501", "B008",]

[tool.setuptools.packages.find]
where = [ ".",]
include = [ "rom_manager*",]
exclude = [ "tests*", "docker*", "docs*", "scripts*",]

[tool.vulture]
ignore_names = ["request", "config"]
