[build-system]
requires = [ "setuptools>=84.0.0", "wheel",]
build-backend = "setuptools.build_meta"

[project]
name = "rom-manager"
version = "3.3.7"
description = "ROM Converter/Organizer (CHD/RVZ) + MCP Server"
readme = "README.md"
classifiers = [ "Development Status :: 5 - Production/Stable", "License :: Public Domain", "Environment :: Console", "Operating System :: POSIX :: Linux", "Programming Language :: Python :: 3",]
requires-python = ">=3.12, <3.15"
dependencies = [ "scion-sdk[mcp]>=0.5.9,<0.6.0", "python-dotenv>=1.2.4", "tqdm>=4.70.1", "requests>=2.34.2",]
[[project.authors]]
name = "Repository Maintainers"
email = "maintainers@knuckles.team"

[project.license]
text = "MIT"

[project.optional-dependencies]
mcp = [ "scion-sdk[mcp]>=0.5.9,<0.6.0",]
native = [ "patool>=4.1.0",]
convert = [ "patool>=4.1.0",]
all = [ "rom-manager[mcp,native]>=2.0.0",]
test = [
    "pytest-xdist>=3.8.0", "pytest>=9.1.1", "pytest-asyncio>=1.4.0", "pytest-cov>=7.1.0",]

[project.scripts]
rom-manager = "rom_manager.rom_manager:rom_manager"
rom-manager-mcp = "rom_manager.mcp_server:mcp_server"

[project.entry-points."agent_connector_sdk.prompt_providers"]
rom-manager = "rom_manager.prompts"

# The one declared connector identity: the fleet name (SCION-CONNECTOR-CONTROL-R071).
[project.entry-points."agent_connector_sdk.connector"]
rom-manager-mcp = "rom_manager:connector"

[tool.uv.workspace]
members = ["."]

[tool.setuptools]
include-package-data = true

[tool.uv]
override-dependencies = [
    "fastmcp-slim[client,server]>=4.1.0",
]


[tool.ruff]
line-length = 88
target-version = "py312"

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true

[dependency-groups]
dev = [
    "pytest-timeout>=2.4.0",
]

[tool.setuptools.package-data]
rom_manager = [ "mcp_config.json", "prompts/*.md", "romm/openapi.json", "prompts/**", "skills/**", "ontology/**", "connectors/**",]

[tool.ruff.lint]
select = [ "E", "F", "I", "UP", "B",]
ignore = [ "E402", "E501", "B008",]

[tool.setuptools.packages.find]
where = [ ".",]
include = [ "rom_manager*",]
exclude = [ "tests*", "docker*", "docs*", "scripts*",]

[tool.vulture]
ignore_names = ["request", "config"]

[tool.pipelines_hooks.ste]
exempt = ["specs/*", "specs/**/*"]

[tool.pipelines.codespell]
ignore_words = ["aggresive", "assasin", "bootup", "covert", "lightyear", "marz", "mater", "nwo", "technic", "wille"]

[tool.pipelines.api_integration]
baseline = 7.4

[tool.setuptools.exclude-package-data]
"*" = ["**/__pycache__/**", "**/*.pyc"]
