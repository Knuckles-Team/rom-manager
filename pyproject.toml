[build-system]
requires = [ "setuptools>=80.9.0", "wheel",]
build-backend = "setuptools.build_meta"

[project]
name = "rom-manager"
version = "2.0.1"
description = "ROM Converter/Organizer (CHD/RVZ) + MCP Server + A2A Agent"
readme = "README.md"
classifiers = [ "Development Status :: 5 - Production/Stable", "License :: Public Domain", "Environment :: Console", "Operating System :: POSIX :: Linux", "Programming Language :: Python :: 3",]
requires-python = ">=3.11, <3.15"
dependencies = [ "agent-utilities>=1.27.1,<2.0.0", "python-dotenv>=1.0.0", "tqdm>=4.66.0", "requests>=2.31.0",]
[[project.authors]]
name = "Project Maintainers"
email = "maintainers@users.noreply.github.com"

[project.license]
text = "MIT"

[project.optional-dependencies]
mcp = [ "agent-utilities[mcp]>=1.27.1,<2.0.0",]
agent = [ "agent-utilities[agent-runtime,logfire]>=1.27.1,<2.0.0", "logfire>=2.0.0",]
native = [ "patool>=2.1.1",]
convert = [ "patool>=2.1.1",]
otel = [ "opentelemetry-sdk>=1.27.0", "opentelemetry-exporter-otlp>=1.27.0",]
all = [ "rom-manager[mcp,agent,native,otel]>=2.0.0",]
test = [
    "pytest-xdist>=3.6.0", "pytest", "pytest-asyncio", "pytest-cov",]

[project.scripts]
rom-manager = "rom_manager.rom_manager:rom_manager"
rom-manager-mcp = "rom_manager.mcp_server:mcp_server"
rom-manager-agent = "rom_manager.agent_server:agent_server"

[project.entry-points."agent_utilities.skill_providers"]
rom-manager = "rom_manager.skills"

[project.entry-points."agent_utilities.ontology_providers"]
rom-manager = "rom_manager.ontology"

[project.entry-points."agent_utilities.source_connector_providers"]
rom-manager = "rom_manager.connectors"

[project.entry-points."agent_utilities.prompt_providers"]
rom-manager = "rom_manager.prompts"

[tool.setuptools]
include-package-data = true

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
check_untyped_defs = true

[dependency-groups]
dev = [
    "pytest-timeout>=2.4.0",
]

[tool.setuptools.package-data]
rom_manager = [ "mcp_config.json", "prompts/*.md", "romm/openapi.json", "prompts/**", "skills/**", "ontology/**", "connectors/**",]

[tool.ruff.lint]
select = [ "E", "F", "I", "UP", "B",]
ignore = [ "E402", "E501", "B008",]

[tool.setuptools.packages.find]
where = [ ".",]
include = [ "rom_manager*",]
exclude = [ "tests*", "docker*", "docs*", "scripts*",]

[tool.vulture]
ignore_names = ["request", "config"]
